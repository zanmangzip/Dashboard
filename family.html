<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 홈 화면에 추가 시 주소창 없이 전체 화면으로 열기 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF9EC">
<title>우리집 가족 대시보드</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  :root {
    --bg: #FFF9EC;
    --card: #FFFFFF;
    --ink: #2D3142;
    --muted: #6E768A;
    --yellow: #FFD166;
    --yellow-soft: #FFF3C4;
    --blue: #4EA8DE;
    --blue-soft: #E3F2FD;
    --green: #52B788;
    --green-soft: #E8F8F0;
    --coral: #FF7B7B;
    --border: #F2E8D5;
    --shadow: 0 10px 24px rgba(45, 49, 66, 0.07);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  /* 가로 화면 2단 대시보드 레이아웃 */
  .dashboard {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 24px;
    width: 100%;
    height: 100%;
    padding: 24px 28px;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 24px 28px;
  }

  /* 시계 & 날짜 카드 */
  .clock-card {
    background: linear-gradient(135deg, #FFFDF7 0%, #FFF4D2 100%);
    border-color: #FFE49E;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex: 1;
    position: relative;
  }

  .date-text {
    font-size: clamp(22px, 2.6vw, 34px);
    font-weight: 800;
    color: #B4690E;
    background: #FFFFFF;
    padding: 8px 22px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(180, 105, 14, 0.08);
    margin-bottom: 14px;
  }

  .time-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
  }

  .ampm {
    font-size: clamp(24px, 2.8vw, 36px);
    font-weight: 800;
    color: var(--blue);
  }

  .time-text {
    font-size: clamp(68px, 9.2vw, 128px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .status-bar {
    position: absolute;
    bottom: 14px;
    right: 20px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .pill-btn {
    border: none;
    background: rgba(255, 255, 255, 0.85);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .pill-btn.active {
    background: var(--green-soft);
    color: #217A53;
  }

  /* 날씨 카드 */
  .weather-card {
    background: linear-gradient(135deg, #F4FAFF 0%, #E6F4FF 100%);
    border-color: #C7E4FA;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .weather-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .weather-loc {
    font-size: clamp(20px, 2.1vw, 26px);
    font-weight: 900;
    color: #1D6FA5;
  }

  .weather-updated {
    font-size: 14px;
    font-weight: 700;
    color: #5C8DB0;
  }

  .weather-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .weather-box {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 22px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .weather-day-label {
    font-size: 16px;
    font-weight: 800;
    color: #1D6FA5;
  }

  .weather-main {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .weather-emoji {
    font-size: clamp(38px, 4.2vw, 52px);
    line-height: 1;
  }

  .weather-temp-now {
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 900;
    color: var(--ink);
  }

  .weather-desc {
    font-size: clamp(16px, 1.6vw, 20px);
    font-weight: 800;
    color: var(--ink);
  }

  .weather-sub {
    font-size: clamp(14px, 1.4vw, 17px);
    font-weight: 700;
    color: var(--muted);
  }

  /* 오른쪽: 가족 할 일 목록 카드 */
  .todo-card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #FFFFFF;
    border-color: #CBEAD9;
  }

  .todo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .todo-title {
    font-size: clamp(24px, 2.5vw, 32px);
    font-weight: 900;
    color: #217A53;
  }

  .todo-progress {
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: 800;
    background: var(--green-soft);
    color: #217A53;
    padding: 6px 16px;
    border-radius: 999px;
  }

  .todo-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 20px;
    background: #FAFBFD;
    border: 3px solid #E8EEF5;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .todo-item:active {
    transform: scale(0.98);
  }

  .todo-item.done {
    background: var(--green-soft);
    border-color: #8CD7B2;
  }

  .todo-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .checkbox {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 3px solid #B8C7D9;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #FFFFFF;
    flex-shrink: 0;
  }

  .todo-item.done .checkbox {
    background: var(--green);
    border-color: var(--green);
  }

  .todo-text {
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 800;
    color: var(--ink);
    word-break: keep-all;
  }

  .todo-item.done .todo-text {
    color: #3D8B68;
    text-decoration: line-through;
  }

  .del-btn {
    border: none;
    background: #FFE5E5;
    color: #D64545;
    font-size: 16px;
    font-weight: 800;
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
  }

  .edit-mode .del-btn {
    display: inline-block;
  }

  .todo-footer {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }

  .todo-input {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    padding: 12px 16px;
    border: 3px solid #DCE7F2;
    border-radius: 16px;
    outline: none;
  }

  .todo-input:focus {
    border-color: var(--blue);
  }

  .btn {
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
    font-family: inherit;
    padding: 12px 18px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-add {
    background: var(--blue);
    color: #FFFFFF;
  }

  .btn-edit {
    background: #EEF2F7;
    color: var(--muted);
  }

  .btn-edit.active {
    background: var(--coral);
    color: #FFFFFF;
  }

  /* 밤 10시 ~ 아침 7시 야간 까만 화면 */
  .night-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    color: #2B2B2B;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: pointer;
  }

  .night-overlay.show {
    display: flex;
  }

  .night-clock {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .night-hint {
    margin-top: 16px;
    font-size: 16px;
    color: #1F1F1F;
  }

  /* 세로 화면일 때 자동 1단 전환 */
  @media (orientation: portrait) {
    html, body { overflow: auto; }
    .dashboard {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 100%;
    }
  }
</style>
</head>
<body>

<div class="dashboard" id="dashboard">
  <!-- 왼쪽: 시계 + 날씨 -->
  <div class="left-col">
    <section class="card clock-card">
      <div class="date-text" id="dateText">2026년 1월 1일 (목)</div>
      <div class="time-wrap">
        <span class="ampm" id="ampmText">오전</span>
        <span class="time-text" id="timeText">00:00</span>
      </div>
      <div class="status-bar">
        <button class="pill-btn" id="wakeBtn" type="button">💡 화면 켜짐 유지</button>
      </div>
    </section>

    <section class="card weather-card">
      <div class="weather-header">
        <div class="weather-loc" id="weatherLoc">📍 용인시 수지구</div>
        <div class="weather-updated" id="weatherUpdated">불러오는 중...</div>
      </div>
      <div class="weather-grid">
        <div class="weather-box">
          <div class="weather-day-label">오늘 날씨</div>
          <div class="weather-main">
            <div class="weather-emoji" id="todayEmoji">🌤️</div>
            <div class="weather-temp-now" id="todayNow">--°</div>
          </div>
          <div class="weather-desc" id="todayDesc">불러오는 중</div>
          <div class="weather-sub" id="todaySub">최고 --° / 최저 --°</div>
        </div>
        <div class="weather-box">
          <div class="weather-day-label">내일 날씨</div>
          <div class="weather-main">
            <div class="weather-emoji" id="tomEmoji">⛅</div>
            <div class="weather-temp-now" id="tomMax">--°</div>
          </div>
          <div class="weather-desc" id="tomDesc">불러오는 중</div>
          <div class="weather-sub" id="tomSub">최저 --° · 비 --%</div>
        </div>
      </div>
    </section>
  </div>

  <!-- 오른쪽: 가족 할 일 목록 -->
  <section class="card todo-card" id="todoCard">
    <div class="todo-header">
      <div class="todo-title">🌈 오늘 우리집 할 일</div>
      <div class="todo-progress" id="todoProgress">0 / 0</div>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="todo-footer">
      <input type="text" class="todo-input" id="todoInput" placeholder="새 할 일 적기 (예: 물 마시기)" maxlength="25">
      <button class="btn btn-add" id="addBtn" type="button">추가</button>
      <button class="btn btn-edit" id="editBtn" type="button">삭제</button>
    </div>
  </section>
</div>

<!-- 밤 10시 ~ 아침 7시 야간 화면 -->
<div class="night-overlay" id="nightOverlay">
  <div class="night-clock" id="nightClock">22:00</div>
  <div class="night-hint">화면을 누르면 15초 동안 밝아져요</div>
</div>

<script>
  /* ================= 설정 영역 ================= */
  const LOCATION = {
    name: "용인시 수지구",
    lat: 37.3221,
    lon: 127.0977
  };

  const NIGHT_START_HOUR = 22;
  const NIGHT_END_HOUR = 7;

  const DEFAULT_TODOS = [
    { id: 1, text: "🪥 아침·저녁 양치하기", done: false },
    { id: 2, text: "📚 책 2권 읽기", done: false },
    { id: 3, text: "🧸 장난감·책상 정리하기", done: false },
    { id: 4, text: "🎒 내일 준비물 챙기기", done: false },
    { id: 5, text: "🌙 밤 9시 30분 잠자리 들기", done: false }
  ];
  /* ============================================ */

  const STORAGE_TODOS_KEY = "family_dash_todos_v1";
  const STORAGE_DATE_KEY = "family_dash_date_v1";

  function getTodayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  const dateText = document.getElementById("dateText");
  const ampmText = document.getElementById("ampmText");
  const timeText = document.getElementById("timeText");
  const nightOverlay = document.getElementById("nightOverlay");
  const nightClock = document.getElementById("nightClock");

  let tempWakeUntil = 0;

  function updateClockAndNight() {
    const now = new Date();
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    const dow = days[now.getDay()];
    dateText.textContent = `${y}년 ${m}월 ${d}일 (${dow})`;

    const h24 = now.getHours();
    const min = String(now.getMinutes()).padStart(2, "0");
    const isPM = h24 >= 12;
    const h12 = h24 % 12 === 0 ? 12 : h24 % 12;

    ampmText.textContent = isPM ? "오후" : "오전";
    timeText.textContent = `${String(h12).padStart(2, "0")}:${min}`;
    nightClock.textContent = `${String(h24).padStart(2, "0")}:${min}`;

    checkDailyReset();

    const isNight = (h24 >= NIGHT_START_HOUR || h24 < NIGHT_END_HOUR);
    const isTempAwake = Date.now() < tempWakeUntil;
    nightOverlay.classList.toggle("show", isNight && !isTempAwake);
  }

  nightOverlay.addEventListener("click", () => {
    tempWakeUntil = Date.now() + 15000;
    nightOverlay.classList.remove("show");
  });

  const WMO_MAP = {
    0: ["☀️", "맑음"],
    1: ["🌤️", "대체로 맑음"],
    2: ["⛅", "구름 조금"],
    3: ["☁️", "흐림"],
    45: ["🌫️", "안개"],
    48: ["🌫️", "짙은 안개"],
    51: ["🌦️", "약한 이슬비"],
    53: ["🌦️", "이슬비"],
    55: ["🌧️", "강한 이슬비"],
    61: ["🌧️", "약한 비"],
    63: ["🌧️", "비"],
    65: ["🌧️", "강한 비"],
    71: ["🌨️", "약한 눈"],
    73: ["❄️", "눈"],
    75: ["❄️", "많은 눈"],
    80: ["🌦️", "소나기"],
    81: ["🌧️", "강한 소나기"],
    82: ["⛈️", "매우 강한 소나기"],
    95: ["⛈️", "천둥번개"]
  };

  function getWmo(code) {
    return WMO_MAP[code] || ["🌤️", "흐림"];
  }

  async function fetchWeather() {
    document.getElementById("weatherLoc").textContent = `📍 ${LOCATION.name}`;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("weather error");
      const data = await res.json();

      const curTemp = Math.round(data.current.temperature_2m);
      const [tEmoji, tDesc] = getWmo(data.current.weather_code);
      const tMax = Math.round(data.daily.temperature_2m_max[0]);
      const tMin = Math.round(data.daily.temperature_2m_min[0]);
      const tRain = data.daily.precipitation_probability_max[0] ?? 0;

      document.getElementById("todayEmoji").textContent = tEmoji;
      document.getElementById("todayNow").textContent = `${curTemp}°`;
      document.getElementById("todayDesc").textContent = tDesc;
      document.getElementById("todaySub").textContent = `최고 ${tMax}° / 최저 ${tMin}° · 비 ${tRain}%`;

      const [nEmoji, nDesc] = getWmo(data.daily.weather_code[1]);
      const nMax = Math.round(data.daily.temperature_2m_max[1]);
      const nMin = Math.round(data.daily.temperature_2m_min[1]);
      const nRain = data.daily.precipitation_probability_max[1] ?? 0;

      document.getElementById("tomEmoji").textContent = nEmoji;
      document.getElementById("tomMax").textContent = `${nMax}°`;
      document.getElementById("tomDesc").textContent = nDesc;
      document.getElementById("tomSub").textContent = `최저 ${nMin}° · 비 ${nRain}%`;

      const now = new Date();
      document.getElementById("weatherUpdated").textContent =
        `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} 업데이트`;
    } catch (e) {
      document.getElementById("weatherUpdated").textContent = "날씨 연결 확인 필요";
    }
  }

  let todos = [];
  let editMode = false;

  const todoCard = document.getElementById("todoCard");
  const todoListEl = document.getElementById("todoList");
  const todoProgressEl = document.getElementById("todoProgress");
  const todoInput = document.getElementById("todoInput");
  const addBtn = document.getElementById("addBtn");
  const editBtn = document.getElementById("editBtn");

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_TODOS_KEY);
      todos = raw ? JSON.parse(raw) : DEFAULT_TODOS.map(t => ({ ...t }));
    } catch (e) {
      todos = DEFAULT_TODOS.map(t => ({ ...t }));
    }
    checkDailyReset();
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_TODOS_KEY, JSON.stringify(todos));
      localStorage.setItem(STORAGE_DATE_KEY, getTodayKey());
    } catch (e) {}
  }

  function checkDailyReset() {
    const today = getTodayKey();
    const savedDate = localStorage.getItem(STORAGE_DATE_KEY);
    if (savedDate && savedDate !== today) {
      todos = todos.map(t => ({ ...t, done: false }));
      saveTodos();
      renderTodos();
    } else if (!savedDate) {
      localStorage.setItem(STORAGE_DATE_KEY, today);
    }
  }

  function renderTodos() {
    todoListEl.innerHTML = "";
    let doneCount = 0;

    todos.forEach(item => {
      if (item.done) doneCount++;
      const row = document.createElement("div");
      row.className = "todo-item" + (item.done ? " done" : "");
      row.innerHTML = `
        <div class="todo-left">
          <div class="checkbox">${item.done ? "✓" : ""}</div>
          <div class="todo-text">${item.text}</div>
        </div>
        <button class="del-btn" type="button">지우기</button>
      `;

      row.addEventListener("click", (e) => {
        if (e.target.classList.contains("del-btn")) {
          todos = todos.filter(t => t.id !== item.id);
          saveTodos();
          renderTodos();
          return;
        }
        if (editMode) return;
        item.done = !item.done;
        saveTodos();
        renderTodos();
      });

      todoListEl.appendChild(row);
    });

    todoProgressEl.textContent = `${doneCount} / ${todos.length} 완료`;
    todoCard.classList.toggle("edit-mode", editMode);
    editBtn.classList.toggle("active", editMode);
    editBtn.textContent = editMode ? "완료" : "삭제";
  }

  addBtn.addEventListener("click", () => {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    todoInput.value = "";
    saveTodos();
    renderTodos();
  });

  todoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addBtn.click();
  });

  editBtn.addEventListener("click", () => {
    editMode = !editMode;
    renderTodos();
  });

  let wakeLock = null;
  const wakeBtn = document.getElementById("wakeBtn");

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      wakeBtn.textContent = "💡 기기 설정에서 화면 유지";
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeBtn.classList.add("active");
      wakeBtn.textContent = "💡 화면 켜짐 유지 중";
      wakeLock.addEventListener("release", () => {
        wakeBtn.classList.remove("active");
        wakeBtn.textContent = "💡 화면 켜짐 유지 (터치)";
      });
    } catch (e) {
      wakeBtn.classList.remove("active");
      wakeBtn.textContent = "💡 화면 켜짐 유지 (터치)";
    }
  }

  wakeBtn.addEventListener("click", requestWakeLock);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  loadTodos();
  renderTodos();
  updateClockAndNight();
  fetchWeather();
  requestWakeLock();

  setInterval(updateClockAndNight, 1000);
  setInterval(fetchWeather, 30 * 60 * 1000);
</script>
</body>
</html>
